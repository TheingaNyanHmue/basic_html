<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="public/css/profile.css">
  <title>My Profile - CSS Example 1</title>
</head>
<body>

  <header>
    <h1>Welcome to My Profile</h1>
    <img src="cat.jpg" alt="My profile photo" width="200">  </header>

  <section class="about">
    <h2>About Me</h2>
    <p>Hello! My name is Lulu. I enjoy drawing and loves cats.</p>
  </section>

  <section class="hobbies">
    <h2>My Hobbies</h2>
    <ul>
      <li>Drawing</li>
      <li>Playing with cats</li>
      <li>Watching films</li>
    </ul>
  </section>

  <section class="skills">
    <h2>Skills</h2>
    <table border="1" cellpadding="8">
      <tr>
        <th>Skill</th>
        <th>Level</th>
      </tr>
      <tr>
        <td>HTML</td>
        <td>Beginner</td>
      </tr>
      <tr>
        <td>Python</td>
        <td>Intermediate</td>
      </tr>
      <tr>
        <td>Machine Learning</td>
        <td>Beginner</td>
      </tr>
      <tr>
        <td>Networking</td>
        <td>Intermediate</td>
      </tr>
    </table>
  </section>

</body>
</html>
